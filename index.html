<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pul hisobi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Och havorang fon + shisha (glass) kartalar */
:root{
  --page:#e4f1ff;
  --bg:rgba(255,255,255,.55);
  --card:rgba(255,255,255,.52);
  --glass-border:rgba(255,255,255,.85);
  --glass-shadow:0 8px 32px rgba(40,90,160,.12),0 1px 2px rgba(40,90,160,.06);
  --text:#0f2540;
  --hint:#6b7f99;
  --accent:#2f7cf6;
  --accent-text:#ffffff;
  --sep:rgba(60,110,170,.14);
  --inc:#12a15e;--exp:#e5484d;--warn:#f5a524;
  --grad-blue:linear-gradient(135deg,#4a90ff,#2f6cf0);
  --grad-green:linear-gradient(135deg,#2ec27e,#12a15e);
  --grad-red:linear-gradient(135deg,#ff6b6f,#e5484d);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--page)}
html,body{margin:0;color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{background:transparent;min-height:100vh;padding-bottom:calc(80px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(40% 35% at 15% 10%,rgba(125,190,255,.55),transparent 70%),
    radial-gradient(35% 30% at 90% 25%,rgba(160,215,255,.6),transparent 70%),
    radial-gradient(45% 40% at 70% 85%,rgba(120,175,255,.45),transparent 70%),
    radial-gradient(30% 30% at 10% 75%,rgba(185,230,255,.6),transparent 70%),
    linear-gradient(180deg,#eaf5ff 0%,#dcecff 100%)}
button{font:inherit;cursor:pointer;color:inherit}
main{max-width:560px;margin:0 auto;padding:12px 16px 24px}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#5a7392;margin:20px 4px 8px}
.muted{color:var(--hint)}
.small{font-size:13px}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* glass */
.card,.tabs,.chip,.seg,.amountbox,.inp,.arrow,.btn{
  background:var(--card);
  -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
  border:1px solid var(--glass-border)}
.card{border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--glass-shadow)}
.card .inp,.card .chip{background:var(--bg)}

.pchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.pchips::-webkit-scrollbar{display:none}
.pchips .chip{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(255,255,255,.62)}
.pnav{display:flex;align-items:center;justify-content:space-between;margin:10px 0 12px}
.pnav b{font-size:17px}
.arrow{width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1}
.arrow:disabled{opacity:.3}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-color:rgba(255,255,255,.9);border-radius:20px;padding:7px 13px;font-size:14px;white-space:nowrap;box-shadow:0 2px 8px rgba(40,90,160,.06)}
.chip.on,.pchips .chip.on{background:var(--grad-blue);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(47,124,246,.35)}
.chip:disabled{opacity:.35}

/* hero */
.hero{position:relative;overflow:hidden;padding:20px 16px;text-align:center}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,0) 55%)}
.hero>*{position:relative;z-index:1}
.hero.pos{background:linear-gradient(160deg,rgba(220,250,235,.75),rgba(255,255,255,.5))}
.hero.neg{background:linear-gradient(160deg,rgba(255,226,228,.75),rgba(255,255,255,.5))}
.hero .status{display:inline-block;padding:4px 12px;border-radius:20px;font-weight:600;font-size:14px;margin-bottom:8px}
.hero.pos .status{background:rgba(31,164,99,.14);color:var(--inc)}
.hero.neg .status{background:rgba(229,72,77,.14);color:var(--exp)}
.hero.zero .status{background:var(--sep);color:var(--hint)}
.hero .big{font-size:34px;font-weight:700;letter-spacing:-.02em;word-break:break-word;font-variant-numeric:tabular-nums}
.hero.pos .big{color:var(--inc)}.hero.neg .big{color:var(--exp)}
.split{display:flex;gap:10px;margin-top:16px}
.split>div{flex:1;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.9);border-radius:14px;padding:10px;text-align:left;min-width:0}
.split .v{font-weight:600;font-size:16px;word-break:break-word}

.actions{display:flex;gap:10px;margin-bottom:12px}
.btn{flex:1;border-radius:16px;padding:14px;font-weight:600;font-size:16px}
.btn.primary{background:var(--grad-blue);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(47,124,246,.35)}
.btn.inc{background:var(--grad-green);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(18,161,94,.32)}
.btn.exp{background:var(--grad-red);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(229,72,77,.32)}
.btn.danger{color:var(--exp)}
.btn.block{display:block;width:100%;margin-top:10px}
.btn.sm{flex:none;padding:10px 14px;font-size:14px;border-radius:12px}
.actions .btn{padding:16px;font-size:17px}

.bar{height:8px;border-radius:4px;background:var(--sep);overflow:hidden;margin:8px 0 6px}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--grad-blue)}

/* rows */
.tx,.list .item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--sep)}
.tx:last-child,.list .item:last-child{border-bottom:0}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}
.tx .amt{font-weight:600;white-space:nowrap}
.amt.neu{color:var(--accent)}
.dayhead{display:flex;justify-content:space-between;color:var(--hint);font-size:13px;margin:16px 4px 6px}
.empty{text-align:center;color:var(--hint);padding:24px 10px}
.empty .e{font-size:38px;margin-bottom:6px}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;background:var(--sep);color:var(--hint);vertical-align:1px}
.badge.red{background:rgba(229,72,77,.14);color:var(--exp)}
.badge.green{background:rgba(18,161,94,.14);color:var(--inc)}
.badge.blue{background:rgba(47,124,246,.14);color:var(--accent)}

/* bank-karta uslubidagi hisoblar */
.wallets{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:4px 16px 16px;scroll-snap-type:x mandatory;scroll-padding:0 16px}
.wallets::-webkit-scrollbar{display:none}
.wallet{position:relative;overflow:hidden;flex:none;min-width:190px;padding:14px 16px;border-radius:20px;color:#fff;scroll-snap-align:start;
  box-shadow:0 10px 24px rgba(30,70,140,.22)}
.wallet::before,.wallet::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.wallet::before{width:140px;height:140px;right:-50px;top:-60px}
.wallet::after{width:90px;height:90px;right:30px;bottom:-55px;background:rgba(255,255,255,.1)}
.wallet>*{position:relative;z-index:1}
.wallet .wn{font-size:13px;opacity:.9;display:flex;justify-content:space-between;gap:10px}
.wallet .v{font-weight:700;font-size:19px;margin-top:16px;letter-spacing:-.01em;white-space:nowrap}
.wallet .s{font-size:12px;opacity:.85}
.wallet.c-UZS{background:linear-gradient(135deg,#3b82f6,#06b6d4)}
.wallet.c-USD{background:linear-gradient(135deg,#10b981,#047857)}
.wallet.c-EGP{background:linear-gradient(135deg,#f59e0b,#c2410c)}

/* stats */
.donutwrap{position:relative;width:180px;height:180px;margin:4px auto 10px}
.donutwrap svg{width:100%;height:100%}
.donutc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:36px}
.donutc b{font-size:16px;word-break:break-word}
.catrow{padding:9px 0;border-bottom:1px solid var(--sep)}
.catrow:last-child{border-bottom:0}
.catrow .bar{height:6px;margin:6px 0 0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpis .card{margin:0;padding:12px 14px}
.kpis .v{font-weight:700;font-size:17px;margin-top:2px;word-break:break-word}
svg text{font-size:10px;fill:var(--hint)}
.legend{display:flex;gap:14px;justify-content:center;font-size:13px;color:var(--hint);margin-top:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:11px;color:var(--hint);text-align:center;padding-bottom:2px}
.cal .d{aspect-ratio:1;border-radius:10px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;font-size:12px;line-height:1.1}
.cal .d span{font-size:9px;opacity:.9}
.cal .d.today{box-shadow:0 0 0 2px var(--accent)}
.cal .d.fut{opacity:.4}

/* forms */
.inp{width:100%;border-radius:12px;padding:12px 14px;font-size:16px;font-family:inherit;outline:none;-webkit-appearance:none;appearance:none;color:var(--text)}
.inp::placeholder{color:#93a5bb}
textarea.inp{min-height:140px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.lbl{display:block;color:var(--hint);font-size:13px;margin:16px 4px 8px}
.seg{display:flex;border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:11px;font-weight:600;font-size:14px}
.seg button.on.n{background:var(--grad-blue);color:#fff}
.seg button.on.e{background:var(--grad-red);color:#fff}
.seg button.on.i{background:var(--grad-green);color:#fff}
.amountbox{display:flex;align-items:baseline;gap:8px;border-radius:18px;padding:14px 16px;margin-top:12px}
.amountbox input{flex:1;min-width:0;border:0;background:none;color:var(--text);font-size:32px;font-weight:700;outline:none;font-family:inherit}
.amountbox.e input{color:var(--exp)}.amountbox.i input{color:var(--inc)}.amountbox.n input{color:var(--accent)}
.amountbox.sm input{font-size:24px}
.ops{display:flex;gap:6px;margin-top:8px}
.ops button{flex:1;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.55);border-radius:12px;padding:8px 0;font-size:18px;font-weight:600;color:var(--accent);-webkit-user-select:none;user-select:none}
.iconbtn{border:0;background:none;color:var(--hint);font-size:18px;padding:4px 8px}

/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;border-width:1px 0 0;background:rgba(255,255,255,.62);box-shadow:0 -6px 24px rgba(40,90,160,.08);padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tabs button{flex:1;border:0;background:none;color:var(--hint);padding:8px 0 6px;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button.on{color:var(--accent)}
.tabs svg{width:23px;height:23px}

.sheet{position:fixed;inset:0;z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,#eaf5ff,#dcecff)}
.sheet.open{transform:none;visibility:visible}
.sheet .in{position:relative;max-width:560px;margin:0 auto;padding:12px 16px calc(32px + env(safe-area-inset-bottom))}
.shead{display:flex;align-items:center;justify-content:space-between;min-height:40px;margin-bottom:6px}
.shead b{font-size:17px}
.link{border:0;background:none;color:var(--accent);font-size:16px;padding:6px 0}
.link.red{color:var(--exp)}
.link.hide{visibility:hidden}

#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:rgba(20,35,60,.92);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#loading,#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--hint);background:linear-gradient(180deg,#eaf5ff,#d6e9ff)}
#loading{z-index:60}
#lock{z-index:100;text-align:center;padding:24px;gap:10px}
#lock .e{font-size:48px}
#lockTitle{color:var(--text);font-size:19px}
#lockMsg{min-height:20px;font-size:14px}
#lockMsg.err{color:var(--exp)}
.dots{display:flex;gap:10px;min-height:14px;margin:6px 0 10px}
.dots i{width:13px;height:13px;border-radius:50%;background:var(--accent);box-shadow:0 2px 6px rgba(47,124,246,.4)}
.dots i.ph{background:rgba(47,124,246,.18);box-shadow:none}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
.pad button{width:72px;height:72px;border-radius:50%;font-size:27px;font-weight:500;color:var(--text);background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.95);box-shadow:0 4px 14px rgba(40,90,160,.1);-webkit-user-select:none;user-select:none}
.pad button.t{background:none;border:0;box-shadow:none;font-size:15px;color:var(--accent)}
.pad button:active{transform:scale(.94)}
.lockbtns{display:flex;gap:12px;margin-top:14px;width:100%;max-width:300px}
#loading.hide,#lock.hide{display:none}
.spin{width:28px;height:28px;border:3px solid var(--sep);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* animatsiyalar */
/* opacity ishlatilmaydi — animatsiya to'xtab qolsa ham kontent ko'rinib turadi */
@keyframes fadeUp{from{transform:translateY(14px) scale(.985)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes wgrow{from{width:0}}
@keyframes popIn{from{transform:scale(.85) rotate(-40deg)}}
.anim .card,.anim .actions,.anim .wallet,.anim .kpis{animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both}
.anim .card:nth-of-type(2),.anim .actions{animation-delay:.05s}
.anim .card:nth-of-type(3){animation-delay:.1s}
.anim .card:nth-of-type(4),.anim .wallet:nth-child(2){animation-delay:.15s}
.anim .card:nth-of-type(n+5),.anim .wallet:nth-child(n+3){animation-delay:.2s}
.anim .bar>i{animation:wgrow .8s cubic-bezier(.2,.8,.2,1) .15s both}
.anim rect.b{transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.anim .donutwrap svg{animation:popIn .7s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){.anim *{animation:none!important}}
</style>
</head>
<body>
<div id="loading" class="hide"><div class="spin"></div><div>Ma’lumotlar yuklanmoqda…</div></div>
<div id="lock" class="hide">
  <div class="e" id="lockIcon">🔒</div>
  <b id="lockTitle">Pul hisobi qulflangan</b>
  <div id="lockMsg">PIN-kodni kiriting</div>
  <div class="dots" id="pinDots"></div>
  <div class="pad" id="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="t" data-k="bio" id="padBio">Face ID</button><button data-k="0">0</button><button class="t" data-k="back">⌫</button>
  </div>
  <div class="lockbtns"><button class="btn" id="pinCancel" data-k="cancel">Bekor</button><button class="btn primary" data-k="ok">Tasdiqlash</button></div>
</div>
<main id="view"></main>

<nav class="tabs" id="tabs">
  <button data-act="tab" data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Asosiy</span></button>
  <button data-act="tab" data-tab="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span>Tarix</span></button>
  <button data-act="tab" data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg><span>Hisobot</span></button>
  <button data-act="tab" data-tab="plans"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg><span>Rejalar</span></button>
  <button data-act="tab" data-tab="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Sozlamalar</span></button>
</nav>

<!-- Yozuv qo'shish / tahrirlash -->
<div class="sheet" id="txSheet"><div class="in">
  <div class="shead">
    <button class="link" data-act="close">Bekor</button>
    <b id="txTitle">Yangi yozuv</b>
    <button class="link red" id="txDel" data-act="delTx">O‘chirish</button>
  </div>
  <div class="seg" id="txType">
    <button class="e" data-act="ftype" data-t="e">− Chiqim</button>
    <button class="i" data-act="ftype" data-t="i">+ Kirim</button>
    <button class="n" data-act="ftype" data-t="x">⇄ O‘tkazma</button>
  </div>
  <div class="amountbox" id="amtBox"><input id="txAmt" inputmode="decimal" placeholder="0" autocomplete="off"><span class="muted" id="txCur"></span></div>
  <div class="ops" id="ops"><button data-o="+">+</button><button data-o="−">−</button><button data-o="×">×</button><button data-o="÷">÷</button><button data-o="=">=</button><button data-o="back">⌫</button></div>
  <div id="curWrap"><div class="seg" id="txCurSeg" style="margin-top:10px">
    <button class="n" data-act="fcur" data-c="UZS">so‘m</button>
    <button class="n" data-act="fcur" data-c="USD">$ dollar</button>
    <button class="n" data-act="fcur" data-c="EGP">junayh</button>
  </div></div>
  <div class="small muted" id="txConv" style="margin:8px 4px 0;min-height:18px"></div>
  <div id="catWrap"><span class="lbl">Kategoriya</span><div class="chips" id="txCats"></div></div>
  <span class="lbl" id="walLbl">Hisob</span>
  <div class="chips" id="txWal"></div>
  <div id="toWrap">
    <span class="lbl">Qayerga</span>
    <div class="chips" id="txWal2"></div>
    <div id="amt2Wrap"><span class="lbl">Qabul qilingan summa (ayirboshlashda)</span>
      <div class="amountbox n sm" style="margin-top:0"><input id="txAmt2" inputmode="decimal" placeholder="0" autocomplete="off"><span class="muted" id="txCur2"></span></div></div>
  </div>
  <span class="lbl">Sana</span>
  <div class="row">
    <button class="chip" data-act="fdate" data-o="0" id="dToday">Bugun</button>
    <button class="chip" data-act="fdate" data-o="-1" id="dYest">Kecha</button>
    <input type="date" class="inp grow" id="txDate">

/* summa maydoni: raqamlarni guruhlash + kalkulyator (+ − × ÷) */
function fmtNumStr(v){
  v=v.replace(/[^\d.,]/g,'').replace('.',',');
  var k=v.indexOf(','); var ip=k<0?v:v.slice(0,k), fp=k<0?'':v.slice(k+1).replace(/,/g,'').slice(0,2);
  ip=ip.replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return ip+(k<0?'':','+fp);
}
function liveFormat(inp){
  var v=inp.value.replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−');
  inp.value=v.split(/([+−×÷])/).map(function(p,i){ return i%2?p:fmtNumStr(p); }).join('');
}
function hasOps(s){ return /[+−×÷]/.test(s); }
function evalExpr(s){
  s=String(s).replace(/\s/g,'').replace(/,/g,'.').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/[+\-*/]+$/,'');
  if(!s) return 0;
  var toks=s.match(/\d+\.?\d*|\.\d+|[+\-*/]/g);
  if(!toks || toks.join('')!==s || toks.length%2===0) return NaN;
  var vals=[],ops=[],i;
  for(i=0;i<toks.length;i++){ if(i%2===0){ var n=parseFloat(toks[i]); if(!isFinite(n)) return NaN; vals.push(n); } else { if(!/^[+\-*/]$/.test(toks[i])) return NaN; ops.push(toks[i]); } }
  var v2=[vals[0]],o2=[];
  for(i=0;i<ops.length;i++){ var o=ops[i], m=vals[i+1];
    if(o==='*') v2[v2.length-1]*=m; else if(o==='/'){ if(m===0) return NaN; v2[v2.length-1]/=m; } else { o2.push(o); v2.push(m); } }
  var r=v2[0]; for(i=0;i<o2.length;i++) r=o2[i]==='+'?r+v2[i+1]:r-v2[i+1];
  return Math.round(r*100)/100;
}
function amountOf(s){ var v=hasOps(s)?evalExpr(s):parseAmt(s); return isFinite(v)?Math.round(v*100)/100:NaN; }

function deser(str){

/* ---------- Shifrlash (AES-GCM 256, kalit PIN-koddan PBKDF2 bilan olinadi) ----------
   PIN yoqilgan bo'lsa Telegram bulutida ham, telefonda ham faqat shifrlangan matn saqlanadi. */
var CRYPTO=null;      // {key, salt}
var ENC_BLOB=null;    // oxirgi shifrlangan nusxa
var LOCKED=false;     // ma'lumot hali ochilmagan — saqlash taqiqlanadi
var KDF_ITER=250000;
function b64(u8){ var s=''; for(var i=0;i<u8.length;i++) s+=String.fromCharCode(u8[i]); return btoa(s); }
function ub64(s){ var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
function isEnc(s){ return typeof s==='string' && s.indexOf('ENC1:')===0; }
function encParts(s){ var p=s.split(':'); return {salt:ub64(p[1]),iv:ub64(p[2]),ct:ub64(p[3])}; }
function deriveKey(pin,salt){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']).then(function(k){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:KDF_ITER,hash:'SHA-256'},k,{name:'AES-GCM',length:256},true,['encrypt','decrypt']); });
}
function encryptStr(plain){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},CRYPTO.key,new TextEncoder().encode(plain)).then(function(ct){
    return 'ENC1:'+b64(CRYPTO.salt)+':'+b64(iv)+':'+b64(new Uint8Array(ct)); });
}
function decryptStr(key,s){ var e=encParts(s); return crypto.subtle.decrypt({name:'AES-GCM',iv:e.iv},key,e.ct).then(function(b){ return new TextDecoder().decode(b); }); }

/* Telegram CloudStorage — 4096 belgilik bo'laklarga bo'lib saqlanadi */
var CHUNK=3800, cloudN=0, lastParts=[], saving=false, again=false, syncState=hasCloud?'load':'local';
var cs={
  get:function(keys){return new Promise(function(r,j){tg.CloudStorage.getItems(keys,function(e,v){e?j(e):r(v||{});});});},
  set:function(k,v){return new Promise(function(r,j){tg.CloudStorage.setItem(k,v,function(e,ok){e?j(e):r(ok);});});},
  rm:function(keys){return new Promise(function(r,j){tg.CloudStorage.removeItems(keys,function(e,ok){e?j(e):r(ok);});});}
};
function payload(){ return CRYPTO?encryptStr(serialize()):Promise.resolve(asciiJson()); }
function save(){
  if(LOCKED) return;   // qulf ochilmaguncha hech narsa yozilmaydi
  payload().then(function(p){
    try{ localStorage.setItem(LS_KEY,p); }catch(e){}
    if(CRYPTO) ENC_BLOB=p;
    persist(p);
  });
}
var pendingStr=null;
function persist(str){
  if(!hasCloud) return;
  if(str) pendingStr=str;
  if(saving || !pendingStr) return;
  saving=true; str=pendingStr; pendingStr=null;
  var parts=[];
  for(var i=0;i<str.length;i+=CHUNK) parts.push(str.slice(i,i+CHUNK));
  var p=Promise.resolve();
  parts.forEach(function(pt,i){ if(lastParts[i]!==pt) p=p.then(function(){return cs.set('d'+i,pt);}); });
  p.then(function(){ return cloudN!==parts.length?cs.set('n',String(parts.length)):null; })
   .then(function(){ if(cloudN>parts.length){ var rm=[]; for(var i=parts.length;i<cloudN;i++) rm.push('d'+i); return cs.rm(rm);} })
   .then(function(){ cloudN=parts.length; lastParts=parts; syncState='ok'; })
   .catch(function(){ syncState='err'; lastParts=[]; })
   .then(function(){ saving=false; if(CUR==='set'&&!LOCKED) render(); if(pendingStr) persist(); });
}
function loadCloud(){
  return cs.get(['n']).then(function(r){
    var n=parseInt(r.n||'0',10); if(!n) return null;
    var keys=[]; for(var i=0;i<n;i++) keys.push('d'+i);
    var batches=[]; for(var b=0;b<keys.length;b+=20) batches.push(keys.slice(b,b+20));
    var parts=[];
    return batches.reduce(function(p,batch){ return p.then(function(){ return cs.get(batch).then(function(v){ batch.forEach(function(k){ parts.push(v[k]||''); }); }); }); }, Promise.resolve())
      .then(function(){ cloudN=n; lastParts=parts; return parts.join(''); });
  });
}

/* ---------- Hisob-kitob ---------- */
function catOf(id){ for(var i=0;i<S.cats.length;i++) if(S.cats[i].id===id) return S.cats[i]; return {id:id,e:'📦',name:'Boshqa',col:PALETTE[9],t:'e'}; }

function byId(list,id){ for(var i=0;i<list.length;i++) if(list[i].id===id) return list[i]; return null; }
function sorted(list){ return list.slice().sort(function(a,b){ return a.d<b.d?1:a.d>b.d?-1:(a.id<b.id?1:-1); }); }
/* foyda/zarar faqat kirim va chiqimdan; o'tkazmalar, qarzlar, maqsadlar hisobga kirmaydi */
function sums(list){ var i=0,e=0; list.forEach(function(x){ if(x.t==='i') i+=x.u; else if(x.t==='e') e+=x.u; }); return {i:i,e:e,n:i-e}; }
function debtPaid(d){ return (d.pays||[]).reduce(function(s,p){return s+p.a;},0); }
function debtRem(d){ return Math.max(0,d.a-debtPaid(d)); }
function goalSaved(g){ return (g.dep||[]).reduce(function(s,p){return s+p.u;},0); }
/* hisob qoldig'i — hisobning o'z valyutasida */
function walBalance(w){
  var b=+w.init||0;
  function cv(v,cur,u){ return cur===w.cur?v:u*rate(w.cur); }
  S.tx.forEach(function(x){
    if(x.t==='x'){ if(x.w===w.id) b-=cv(x.a,x.cur,x.u); if(x.w2===w.id) b+=cv(x.a2,x.cur2,x.u); return; }
    if(x.w!==w.id) return; var v=cv(x.a,x.cur,x.u); b+=x.t==='i'?v:-v;
  });
  S.debts.forEach(function(d){
    if(d.w!==w.id) return;
    var k=d.cur===w.cur?1:rate(w.cur)/rate(d.cur), sg=d.k==='gave'?-1:1;
    b+=sg*d.a*k; b-=sg*debtPaid(d)*k;
  });
  return b;
}
function catSpent(id,ym){ var s=0; S.tx.forEach(function(x){ if(x.t==='e'&&x.c===id&&x.d.slice(0,7)===ym) s+=x.u; }); return s; }
/* limit o'z valyutasida saqlanadi (c.lc), taqqoslash dollarda */
function limCur(c){ return CURS[c.lc]?c.lc:'USD'; }
/* shu oy kategoriyadagi chiqim — limit valyutasida (bir xil valyutadagilar aniq summasi bilan) */
function catSpentL(c,ym){ var k=limCur(c), s=0; S.tx.forEach(function(x){ if(x.t==='e'&&x.c===c.id&&x.d.slice(0,7)===ym) s+=x.cur===k?x.a:x.u*rate(k); }); return Math.round(s*100)/100; }

function catsFor(t){
  var since=ymd(addDays(today0(),-120)), cnt={};
  S.tx.forEach(function(x){ if(x.t===t&&x.d>=since) cnt[x.c]=(cnt[x.c]||0)+1; });
  return S.cats.filter(function(c){return c.t===t;}).map(function(c,i){ return {c:c,i:i,n:/_other$/.test(c.id)?-1:(cnt[c.id]||0)}; })
    .sort(function(a,b){ return b.n-a.n||a.i-b.i; }).map(function(o){return o.c;});
}

function pendingRec(){
  var t=today0(), tStr=ymd(t), curYm=ymOf(t), out=[];
  S.rec.forEach(function(r){
    var p=String(r.last||curYm).split('-').map(Number), y=p[0], m=p[1]+1;
    if(m>12){ m=1; y++; }
    var key=y+'-'+pad(m); if(key>curYm) return;
    var dd=Math.min(r.day||1,new Date(y,m,0).getDate()), date=key+'-'+pad(dd);
    if(date>tStr) return;
    out.push({r:r,key:key,date:date});
  });
  return out;
}
function recToTx(p){
  var r=p.r;
  S.tx.push({id:uid(),t:r.t,a:r.a,c:r.c,d:p.date,n:r.n||'',w:byId(S.wallets,r.w)?r.w:S.wallets[0].id,cur:r.cur,u:toUsd(r.a,r.cur)});
  r.last=p.key;

  var changed=false;
  for(var k=0;k<60;k++){ var ps=pendingRec().filter(function(p){return p.r.auto;}); if(!ps.length) break; ps.forEach(recToTx); changed=true; }
  if(changed){ save(); toast('🔁 Takroriy to‘lovlar avtomatik qo‘shildi'); }

var P={type:'month',off:0};
function range(type,off){
  type=type||P.type; off=off==null?P.off:off;
  var t=today0(), st, en;
  if(type==='day'){ st=en=addDays(t,off); return {from:ymd(st),to:ymd(en),st:st,en:en,label:off===0?'Bugun':off===-1?'Kecha':dayLabel(st)+', '+WD[st.getDay()]}; }
  if(type==='week'){ st=addDays(t,-((t.getDay()+6)%7)+off*7); en=addDays(st,6);
    return {from:ymd(st),to:ymd(en),st:st,en:en,label:off===0?'Shu hafta':off===-1?'O‘tgan hafta':st.getDate()+' '+MS[st.getMonth()]+' – '+en.getDate()+' '+MS[en.getMonth()]}; }
  if(type==='month'){ st=new Date(t.getFullYear(),t.getMonth()+off,1); en=new Date(st.getFullYear(),st.getMonth()+1,0);
    return {from:ymd(st),to:ymd(en),st:st,en:en,label:MONTHS[st.getMonth()]+' '+st.getFullYear()}; }
  if(type==='year'){ var y=t.getFullYear()+off; st=new Date(y,0,1); en=new Date(y,11,31); return {from:ymd(st),to:ymd(en),st:st,en:en,label:y+'-yil'}; }
  return {from:'0000-01-01',to:'9999-12-31',label:'Butun davr'};
}
function inR(r){ return function(x){ return x.d>=r.from && x.d<=r.to; }; }
function elapsedDays(r){
  var t=today0(), st=r.st, en=r.en;
  if(!st){ if(!S.tx.length) return 1; var min=S.tx.reduce(function(m,x){return x.d<m?x.d:m;},'9999'); st=parseYmd(min); en=t; }
  if(en>t) en=t;
  if(st>t) return Math.round((r.en-r.st)/864e5)+1;
  return Math.max(1,Math.round((en-st)/864e5)+1);
}

function donut(items,total){
  var R=54, C=2*Math.PI*R, off=0;
  var segs=items.map(function(it){ var len=it.v/total*C; var gap=items.length>1?Math.min(1.5,len/3):0;
    var s='<circle r="'+R+'" cx="70" cy="70" fill="none" stroke="'+it.col+'" stroke-width="20" stroke-dasharray="'+Math.max(0,len-gap)+' '+(C-len+gap)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 70 70)"/>'; off+=len; return s; }).join('');
  return '<svg viewBox="0 0 140 140"><circle r="'+R+'" cx="70" cy="70" fill="none" stroke="var(--sep)" stroke-width="20"/>'+segs+'</svg>';
}
function barChart(endDate){
  var months=[];
  for(var k=5;k>=0;k--){ var st=new Date(endDate.getFullYear(),endDate.getMonth()-k,1), en=new Date(st.getFullYear(),st.getMonth()+1,0);
    var s=sums(S.tx.filter(inR({from:ymd(st),to:ymd(en)}))); months.push({l:MS[st.getMonth()],i:s.i,e:s.e}); }
  var max=Math.max.apply(null,months.map(function(m){return Math.max(m.i,m.e);}))||1;
  var W=320,Hh=150,top=12,bot=22,gw=W/6,bw=Math.min(16,gw*0.3),ch=Hh-top-bot,svg='';
  [0.5,1].forEach(function(f){ var yy=top+ch*(1-f); svg+='<line x1="0" x2="'+W+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--sep)" stroke-dasharray="3 3"/>'; });
  months.forEach(function(m,i){ var cx=gw*i+gw/2, hi=m.i/max*ch, he=m.e/max*ch;
    svg+='<rect class="b" style="animation-delay:'+(i*0.05)+'s" x="'+(cx-bw-1)+'" y="'+(top+ch-hi)+'" width="'+bw+'" height="'+Math.max(hi,m.i?2:0)+'" rx="3" fill="var(--inc)"/>';
    svg+='<rect class="b" style="animation-delay:'+(i*0.05+0.03)+'s" x="'+(cx+1)+'" y="'+(top+ch-he)+'" width="'+bw+'" height="'+Math.max(he,m.e?2:0)+'" rx="3" fill="var(--exp)"/>';
    svg+='<text x="'+cx+'" y="'+(Hh-6)+'" text-anchor="middle">'+m.l+'</text>';
    if(m.i||m.e){ var n=m.i-m.e; svg+='<text x="'+cx+'" y="'+(top+ch-Math.max(hi,he)-3)+'" text-anchor="middle" style="fill:'+(n<0?'var(--exp)':'var(--inc)')+'">'+(n<0?'−':'+')+short(Math.abs(n))+'</text>'; }
  });
  return '<svg viewBox="0 0 '+W+' '+Hh+'" style="width:100%;height:auto;overflow:visible">'+svg+'</svg>';
}
function calendar(r){
  var by={}, max=0, t=ymd(today0());
  S.tx.forEach(function(x){ if(x.t==='e'&&x.d>=r.from&&x.d<=r.to) by[x.d]=(by[x.d]||0)+x.u; });
  Object.keys(by).forEach(function(k){ if(by[k]>max) max=by[k]; });
  var lead=(r.st.getDay()+6)%7, dim=r.en.getDate(), pre=r.from.slice(0,8);
  var h='<div class="cal">'+['Du','Se','Ch','Pa','Ju','Sh','Ya'].map(function(d){return '<div class="h">'+d+'</div>';}).join('');
  for(var i=0;i<lead;i++) h+='<div></div>';
  for(var d=1;d<=dim;d++){
    var ds=pre+pad(d), v=by[ds]||0, a=v?0.16+0.74*v/max:0;
    var st=v?'background:rgba(229,72,77,'+a.toFixed(2)+');color:'+(a>0.5?'#fff':'var(--text)')+';border-color:transparent':'';
    h+='<button class="d'+(ds===t?' today':'')+(ds>t?' fut':'')+'" data-act="calday" data-d="'+ds+'" style="'+st+'"><b>'+d+'</b>'+(v?'<span>'+short(v)+'</span>':'')+'</button>';
  }
  return h+'</div><div class="small muted" style="margin-top:8px;text-align:center">Rang qanchalik to‘q bo‘lsa — o‘sha kuni chiqim shuncha ko‘p ($). Kunni bossangiz yozuvlari ochiladi.</div>';
}

function closeTop(){ var id=stack.pop(); if(id){ $('#'+id).classList.remove('open'); if(document.activeElement) document.activeElement.blur(); } syncBack(); }
function syncBack(){ if(!inTG||!ver('6.1')) return; if(stack.length) tg.BackButton.show(); else tg.BackButton.hide(); }
if(inTG && ver('6.1')) tg.BackButton.onClick(closeTop);
function sheet2(title,html){ $('#s2Title').textContent=title; $('#s2Body').innerHTML=html; openSheet('sheet2'); $('#sheet2').scrollTop=0; }

function otherWallet(id){ var o=S.wallets.filter(function(w){return w.id!==id;})[0]; return o?o.id:id; }
function fillA2(){
  if(F.t!=='x' || F.cur===F.cur2 || F.a2manual) return;
  var a=amountOf($('#txAmt').value);
  $('#txAmt2').value=a>0?inputVal(Math.round(a/rate(F.cur)*rate(F.cur2)*100)/100,F.cur2):'';

function drawForm(){
  var X=F.t==='x';

  $('#amtBox').className='amountbox '+(X?'n':F.t);

    if(!F.w2 || F.w2===F.w || !byId(S.wallets,F.w2)) F.w2=otherWallet(F.w);
    F.cur2=walOf(F.w2).cur;
  }

  $('#catWrap').style.display=X?'none':'';
  $('#toWrap').style.display=X?'':'none';
  $('#walLbl').textContent=X?'Qayerdan':'Hisob';
  if(!X) $('#txCats').innerHTML=catsFor(F.t).map(function(c){ return '<button class="chip'+(F.c===c.id?' on':'')+'" data-act="fcat" data-id="'+esc(c.id)+'">'+esc(c.e+' '+c.name)+'</button>'; }).join('');
  $('#txWal').innerHTML=S.wallets.map(function(w){ return '<button class="chip'+(F.w===w.id?' on':'')+'" data-act="fwal" data-id="'+esc(w.id)+'">'+esc(w.e+' '+w.name)+'</button>'; }).join('');
  $('#txWal2').innerHTML=S.wallets.map(function(w){ return '<button class="chip'+(F.w2===w.id?' on':'')+'" data-act="fwal2" data-id="'+esc(w.id)+'"'+(w.id===F.w?' disabled':'')+'>'+esc(w.e+' '+w.name)+'</button>'; }).join('');
  $('#amt2Wrap').style.display=(X && F.cur!==F.cur2)?'':'none';
  $('#txCur2').textContent=CURS[F.cur2||'USD'].sym;
  $('#txDate').value=F.d;
  document.querySelectorAll('#txCurSeg button').forEach(function(b){ b.classList.toggle('on',b.dataset.c===F.cur); });
  $('#txCur').textContent=CURS[F.cur].sym;
  $('#repChip').style.display=(!F.id && !X)?'':'none';
  $('#repChip').classList.toggle('on',!!F.rep);
  fillA2(); drawConv();
  var t=ymd(today0()), y=ymd(addDays(today0(),-1));
  $('#dToday').classList.toggle('on',F.d===t); $('#dYest').classList.toggle('on',F.d===y);
}
function txUsd(a){
  // tahrirda summa va valyuta o'zgarmagan bo'lsa — eski (kiritilgan kundagi) kurs saqlanadi
  var o=F.orig; if(o && o.a===a && o.cur===F.cur) return o.u;
  return toUsd(a,F.cur);
}
function drawConv(){
  var raw=$('#txAmt').value, a=amountOf(raw), parts=[];
  if(hasOps(raw)) parts.push('= '+(a>0?amt(a,F.cur):'?'));
  if(F.cur!=='USD' && a>0) parts.push('≈ '+money(txUsd(a)));
  if(F.t!=='x' && F.cur!=='USD') parts.push('kurs: 1 $ = '+fmt(rate(F.cur))+' '+CURS[F.cur].sym);
  if(F.t==='x' && F.cur!==F.cur2){ var a2=parseAmt($('#txAmt2').value);
    if(a>0 && a2>0){ var r=F.cur==='USD'?a2/a:F.cur2==='USD'?a/a2:0; if(r) parts.push('ayirboshlash kursi: 1 $ = '+fmt(r)+' '+CURS[F.cur==='USD'?F.cur2:F.cur].sym); } }
  $('#txConv').textContent=parts.join(' · ');
}
$('#txAmt').addEventListener('input',function(e){ liveFormat(e.target); fillA2(); drawConv(); });
$('#txAmt2').addEventListener('input',function(e){ F.a2manual=true; liveFormat(e.target); drawConv(); });
$('#txDate').addEventListener('change',function(e){ if(e.target.value){ F.d=e.target.value; drawForm(); } });
/* kalkulyator tugmalari — klaviatura yopilmasligi uchun bosilganda darhol ishlaydi */
function doOp(o){
  var inp=$('#txAmt'), v=inp.value;
  if(o==='back') v=v.replace(/\s+$/,'').slice(0,-1);
  else if(o==='='){ var r=amountOf(v); if(r>0) v=inputVal(r,F.cur); }
  else { if(!v.replace(/\s/g,'')) return; v=/[+−×÷]$/.test(v)?v.slice(0,-1)+o:v+o; }
  inp.value=v; liveFormat(inp); fillA2(); drawConv(); hap();
}
(function(){ var ops=$('#ops');
  function h(e){ var b=e.target.closest('button'); if(!b) return; e.preventDefault(); doOp(b.dataset.o); }
  ops.addEventListener('touchstart',h,{passive:false}); ops.addEventListener('mousedown',h); })();

function checkLimit(x){
  if(x.t!=='e') return;
  var c=catOf(x.c); if(!(c.limit>0)) return;
  var s=catSpentL(c,x.d.slice(0,7)), p=Math.round(s/c.limit*100);
  if(p>=80) setTimeout(function(){ hap('warn'); toast((p>=100?'⛔ ':'⚠️ ')+'“'+c.name+'” limiti: '+p+'% ('+amt(s,limCur(c))+' / '+limAmt(c)+')'); },1400);
}

/* ---------- Face ID (Telegram BiometricManager) — shifrlash kalitini qurilmada saqlaydi ---------- */
var BIO_OK=false;
function bioMgr(){ return inTG && ver('7.2') && tg.BiometricManager ? tg.BiometricManager : null; }
function bioInit(cb){ var bm=bioMgr(); if(!bm) return cb(false); if(bm.isInited){ BIO_OK=bm.isBiometricAvailable; return cb(BIO_OK); } bm.init(function(){ BIO_OK=bm.isBiometricAvailable; cb(BIO_OK); }); }
function bioSaved(){ var bm=bioMgr(); return !!(bm && bm.isInited && bm.isBiometricTokenSaved); }
function bioGetKey(cb){
  var bm=bioMgr(); if(!bm || !bm.isBiometricTokenSaved) return cb(null);
  bm.authenticate({reason:'Pul hisobini ochish'},function(ok,token){
    if(!ok || !token) return cb(null);
    crypto.subtle.importKey('raw',ub64(token),{name:'AES-GCM'},true,['encrypt','decrypt']).then(cb,function(){ cb(null); });
  });
}
function bioStoreKey(cb){
  var bm=bioMgr(); if(!bm || !CRYPTO) return cb(false);
  var go=function(){ crypto.subtle.exportKey('raw',CRYPTO.key).then(function(raw){
    bm.authenticate({reason:'Face ID bilan ochishni yoqish'},function(ok){ if(!ok) return cb(false); bm.updateBiometricToken(b64(new Uint8Array(raw)),function(r){ cb(!!r); }); }); }); };
  if(!bm.isAccessGranted) bm.requestAccess({reason:'Pul hisobini Face ID bilan ochish uchun'},function(g){ if(g) go(); else cb(false); });
  else go();
}
function bioClear(){ var bm=bioMgr(); if(bm && bm.isBiometricTokenSaved) bm.updateBiometricToken('',function(){}); }

/* ---------- PIN ekran ----------
   rejimlar: unlock (ochish), set1/set2 (yangi PIN), verify (amal oldidan tekshirish) */
var PIN={mode:'unlock',buf:'',first:'',onOk:null,busy:false};
var PIN_MIN=6, PIN_MAX=12;
function lockShow(mode,opts){
  opts=opts||{};
  PIN={mode:mode,buf:'',first:'',onOk:opts.onOk||null,busy:false};
  $('#lockIcon').textContent=mode==='unlock'?'🔒':'🔐';
  $('#lockTitle').textContent=opts.title||(mode==='unlock'?'Pul hisobi qulflangan':'PIN-kod');
  lockMsg(opts.msg||(mode==='set1'?'Yangi PIN-kod o‘ylab toping (kamida 6 raqam)':'PIN-kodni kiriting'));
  $('#pinCancel').style.display=mode==='unlock'?'none':'';
  $('#padBio').style.visibility=(mode==='unlock'&&bioSaved())?'visible':'hidden';
  drawDots();
  $('#lock').classList.remove('hide');
  if(mode==='unlock' && bioSaved()) setTimeout(tryBio,250);
}
function lockHide(){ $('#lock').classList.add('hide'); PIN.buf=''; }
function lockMsg(t,err){ var m=$('#lockMsg'); m.textContent=t; m.classList.toggle('err',!!err); }
function drawDots(){ var n=Math.max(PIN_MIN,PIN.buf.length), h=''; for(var i=0;i<n;i++) h+='<i class="'+(i<PIN.buf.length?'':'ph')+'"></i>'; $('#pinDots').innerHTML=h; }
function failWait(){ try{ var u=+localStorage.getItem('ph_until')||0; return Math.max(0,Math.ceil((u-Date.now())/1000)); }catch(e){ return 0; } }
function failAdd(){ try{ var f=(+localStorage.getItem('ph_fail')||0)+1; localStorage.setItem('ph_fail',f); if(f>=5) localStorage.setItem('ph_until',Date.now()+30000*Math.pow(2,Math.min(f-5,6))); }catch(e){} }
function failReset(){ try{ localStorage.removeItem('ph_fail'); localStorage.removeItem('ph_until'); }catch(e){} }
function openWithKey(key,salt){
  return decryptStr(key,ENC_BLOB).then(function(plain){
    var first=LOCKED;
    if(first) S=deser(plain);
    CRYPTO={key:key,salt:salt}; LOCKED=false; failReset(); lockHide(); hap('ok');
    if(first) afterOpen();
  });
}
function tryBio(){
  bioGetKey(function(key){ if(!key) return; openWithKey(key,encParts(ENC_BLOB).salt).catch(function(){ lockMsg('Face ID kaliti eskirgan — PIN-kodni kiriting',true); bioClear(); }); });
}
function pinSubmit(){
  if(PIN.busy) return;
  var pin=PIN.buf;
  if(pin.length<PIN_MIN){ lockMsg('Kamida '+PIN_MIN+' ta raqam kiriting',true); hap('err'); return; }
  if(PIN.mode==='set1'){ PIN.first=pin; PIN.buf=''; PIN.mode='set2'; lockMsg('PIN-kodni yana bir marta kiriting'); drawDots(); return; }
  if(PIN.mode==='set2'){
    if(pin!==PIN.first){ PIN.mode='set1'; PIN.buf=''; PIN.first=''; drawDots(); lockMsg('Mos kelmadi. Qaytadan o‘ylab toping',true); hap('err'); return; }
    PIN.busy=true; lockMsg('Shifrlanmoqda…');
    var salt=crypto.getRandomValues(new Uint8Array(16));
    deriveKey(pin,salt).then(function(key){ var cb=PIN.onOk; CRYPTO={key:key,salt:salt}; lockHide(); save(); if(cb) cb(); });
    return;
  }
  var w=failWait(); if(w>0){ lockMsg('Juda ko‘p xato. '+w+' soniyadan keyin urinib ko‘ring',true); return; }
  PIN.busy=true; lockMsg('Tekshirilmoqda…');
  var salt2=encParts(ENC_BLOB).salt;
  deriveKey(pin,salt2).then(function(key){
    if(PIN.mode==='verify'){ return decryptStr(key,ENC_BLOB).then(function(){ var cb=PIN.onOk; failReset(); lockHide(); if(cb) cb(); }); }
    return openWithKey(key,salt2);
  }).catch(function(){ PIN.busy=false; PIN.buf=''; drawDots(); failAdd(); hap('err'); var w2=failWait(); lockMsg(w2?'Noto‘g‘ri PIN. '+w2+' soniya kuting':'Noto‘g‘ri PIN-kod',true); });
}
(function(){
  var pad=$('#lock');
  function h(e){ var b=e.target.closest('[data-k]'); if(!b) return; e.preventDefault(); var k=b.dataset.k;
    if(k==='back') PIN.buf=PIN.buf.slice(0,-1);
    else if(k==='ok') return pinSubmit();
    else if(k==='bio') return tryBio();
    else if(k==='cancel'){ lockHide(); return; }
    else if(PIN.buf.length<PIN_MAX) PIN.buf+=k;
    if(PIN.mode!=='unlock'||!PIN.busy) lockMsg(PIN.mode==='set2'?'PIN-kodni yana bir marta kiriting':PIN.mode==='set1'?'Yangi PIN-kod o‘ylab toping (kamida 6 raqam)':'PIN-kodni kiriting');
    drawDots(); hap(); }
  pad.addEventListener('touchstart',h,{passive:false}); pad.addEventListener('mousedown',h);
})();

    var rec;
    if(F.t==='x'){
      if(!F.w2 || F.w2===F.w){ hap('err'); toast('Boshqa hisobni tanlang (qayerga)'); return; }
      var a2=F.cur===F.cur2?a:amountOf($('#txAmt2').value);
      if(!(a2>0)){ hap('err'); toast('Qabul qilingan summani kiriting'); return; }
      rec={id:F.id||uid(),t:'x',a:a,c:'transfer',d:F.d,n:$('#txNote').value.trim(),w:F.w,cur:F.cur,u:txUsd(a),w2:F.w2,a2:a2,cur2:F.cur2};
    } else {
      if(!F.c){ hap('err'); toast('Kategoriyani tanlang'); return; }
      rec={id:F.id||uid(),t:F.t,a:a,c:F.c,d:F.d,n:$('#txNote').value.trim(),w:F.w,cur:F.cur,u:txUsd(a)};
    }
    if(F.id){ S.tx=S.tx.map(function(x){return x.id===F.id?rec:x;}); } else S.tx.push(rec);
    if(F.rep && !F.id && F.t!=='x'){ var dd=parseYmd(F.d); S.rec.push({id:uid(),t:F.t,a:a,cur:F.cur,c:F.c,w:F.w,n:rec.n,day:dd.getDate(),last:ymOf(dd),auto:false}); }
    S.settings.lastW=F.w;
    save(); closeTop(); render(); hap('ok');
    toast(F.id?'O‘zgartirildi':(F.t==='i'?'Kirim':F.t==='x'?'O‘tkazma':'Chiqim')+' qo‘shildi: '+amt(a,F.cur)+(F.rep?' · har oy takrorlanadi':''));
    checkLimit(rec);
  },

function goalMove(id,sign){
  var g=byId(S.goals,id), a=amountOf($('#gA').value), cur=$('#gCur').dataset.v||'USD';
  if(!(a>0)){ toast('Summani kiriting'); return; }
  var u=toUsd(a,cur)*sign; g.dep=g.dep||[];
  g.dep.push({d:ymd(today0()),u:u,o:cur!=='USD'?amt(a,cur):''});
  var done=goalSaved(g)>=g.target;
  save(); render(); goalView(id); hap('ok'); toast(done&&sign>0?'🎉 Maqsadga erishdingiz!':(sign>0?'Qo‘shildi: ':'Olindi: ')+money(Math.abs(u)));
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el || el.disabled) return;
  var f=A[el.dataset.act]; if(f){ e.preventDefault(); f(el,e); }
});

/* ---------- Valyuta kurslari (open.er-api.com, bepul) ---------- */
var ratesBusy=false;
function updateRates(manual){
  if(ratesBusy) return;
  if(!manual && (!S.settings.ratesAuto || Date.now()-(S.settings.ratesAt||0)<6*3600e3)) return;
  ratesBusy=true;
  fetch('https://open.er-api.com/v6/latest/USD').then(function(r){return r.json();}).then(function(j){
    if(!j || j.result!=='success' || !j.rates || !(j.rates.UZS>0) || !(j.rates.EGP>0)) throw new Error('bad');
    S.settings.rates={UZS:Math.round(j.rates.UZS*100)/100,EGP:Math.round(j.rates.EGP*100)/100};
    S.settings.ratesAt=Date.now(); S.settings.ratesAuto=true;
    save(); if(CUR==='set') render(); if(manual) toast('Kurs yangilandi: 1 $ = '+fmt(S.settings.rates.UZS)+' so‘m');
  }).catch(function(){ if(manual) toast('Kursni olib bo‘lmadi — internetni tekshiring'); })
  .then(function(){ ratesBusy=false; });
}

/* ---------- Ishga tushirish ---------- */
var pushLocalToCloud=false;
function afterOpen(){
  if(S.settings.lock){ delete S.settings.lock; setTimeout(function(){ toast('🔐 Yangi himoya: Sozlamalar → Xavfsizlik → PIN-kod va shifrlash'); },1500); }
  try{ localStorage.removeItem('ph_lock'); }catch(e){}
  if(pushLocalToCloud){ pushLocalToCloud=false; lastParts=[]; save(); }
  processAutoRec(); lastHero=null; render(true); updateRates();
}
function startWith(raw){
  if(isEnc(raw)){
    ENC_BLOB=raw; LOCKED=true; S=defaults();
    bioInit(function(){ lockShow('unlock'); });
    return;
  }
  try{ S=raw?deser(raw):defaults(); }catch(e){ S=defaults(); }
  afterOpen();
}
bioInit(function(){});
if(hasCloud){
  $('#loading').classList.remove('hide');
  var started=false, go=function(raw){ if(started) return; started=true; $('#loading').classList.add('hide'); startWith(raw); };
  setTimeout(function(){ if(!started){ syncState='err'; go(LOCAL_RAW); } },8000);
  loadCloud().then(function(str){
    syncState='ok';
    if(!str && LOCAL_RAW) pushLocalToCloud=true;
    go(str||LOCAL_RAW);
  }).catch(function(){ syncState='err'; go(LOCAL_RAW); if(!LOCKED) toast('Bulutdan yuklab bo‘lmadi — mahalliy nusxa ko‘rsatilmoqda'); });
} else startWith(LOCAL_RAW);
})();
